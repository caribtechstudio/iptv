[package]
name = "fluxo"
version = "0.3.0"
description = "Lecteur IPTV et multimédia pour macOS"
authors = ["Fluxo"]
edition = "2024"

[lib]
name = "fluxo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
iptv-core = { path = "../crates/iptv-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "blocking"] }
url = "2"
chrono = "0.4"
flate2 = "1"
keyring = "4.2"
