name: Vérification Fluxo
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: ./scripts/verify.sh --bundle
